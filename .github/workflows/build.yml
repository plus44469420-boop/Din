name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  PS5_SDK_VERSION: v0.44

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18

      - name: Install ps5-payload-sdk
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/${PS5_SDK_VERSION}/ps5-payload-sdk.zip
          sudo unzip -q -d /opt ps5-payload-sdk.zip
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build payload
        run: make -C payload

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: converter

      - name: Build and test the converter
        run: |
          cargo build --release --manifest-path converter/Cargo.toml
          cargo test --release --manifest-path converter/Cargo.toml

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload/ps5cable.elf

      - name: Package for Linux
        run: |
          d=out/ps5cable-linux-x64
          mkdir -p "$d"
          cp payload/ps5cable.elf converter/target/release/ps5cable-convert \
             pc/ps5cable.py pc/usblink.py pc/convert.py pc/hub.py pc/hub_ui.html \
             pc/requirements.txt pc/60-ps5cable.rules README.md LICENSE "$d/"
          tar -C out -czf out/ps5cable-linux-x64.tar.gz ps5cable-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: ps5cable-linux-x64
          path: out/ps5cable-linux-x64.tar.gz

  macos-app:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: payload

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: converter

      - name: Build ps5cable-convert
        run: cargo build --release --manifest-path converter/Cargo.toml

      - name: Package for macOS
        run: |
          d=out/ps5cable-macos-arm64
          mkdir -p "$d"
          cp payload/ps5cable.elf converter/target/release/ps5cable-convert \
             pc/ps5cable.py pc/usblink.py pc/convert.py pc/hub.py pc/hub_ui.html \
             pc/requirements.txt pc/60-ps5cable.rules README.md LICENSE "$d/"
          tar -C out -czf out/ps5cable-macos-arm64.tar.gz ps5cable-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: ps5cable-macos-arm64
          path: out/ps5cable-macos-arm64.tar.gz

  windows-app:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: payload

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: converter

      - name: Build ps5cable-convert.exe
        run: cargo build --release --manifest-path converter/Cargo.toml

      - name: Build ps5cable-hub.exe and ps5cable.exe
        shell: bash
        run: |
          pip install pyinstaller -r pc/requirements.txt
          usb="--collect-all libusb_package --hidden-import usb.backend.libusb1"
          pyinstaller --onefile --noconsole --name ps5cable-hub --paths pc $usb \
            --add-data "pc/hub_ui.html;." --add-data "payload/ps5cable.elf;." \
            --add-binary "converter/target/release/ps5cable-convert.exe;." pc/hub.py
          pyinstaller --onefile --console --name ps5cable --paths pc $usb pc/ps5cable.py

      - name: Smoke test the hub executable
        shell: bash
        run: |
          ./dist/ps5cable-hub.exe --no-browser --stay --port 8799 --settings hub-test.json > hub.log 2>&1 &
          for i in $(seq 1 30); do grep -q "running at" hub.log && break; sleep 1; done
          url=$(grep -o 'http[^ ]*' hub.log)
          page=$(curl -sf "$url")
          grep -q "ps5cable Hub" <<<"$page"
          state=$(curl -sf -H "X-Hub-Token: ${url##*t=}" http://127.0.0.1:8799/api/state)
          grep -q ps5cable.elf <<<"$state"
          # No cable on the runner: libusb loaded and found nothing, rather than "USB support missing".
          for i in $(seq 1 10); do
            state=$(curl -sf -H "X-Hub-Token: ${url##*t=}" -X POST -d '{}' http://127.0.0.1:8799/api/refresh)
            grep -q '"state": "no_cable"' <<<"$state" && break
            sleep 1
          done
          echo "$state"
          grep -q '"state": "no_cable"' <<<"$state"
          jobs=$(curl -sf -H "X-Hub-Token: ${url##*t=}" http://127.0.0.1:8799/api/convert/jobs)
          grep -q ps5cable-convert.exe <<<"$jobs"
          taskkill //F //IM ps5cable-hub.exe || true

      # The runner is an administrator, so this is the elevated half of the
      # app's Install driver button: Windows must accept the self-signed package.
      - name: Install the cable's USB driver
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ps5cable-hub.exe -Wait -PassThru `
            -ArgumentList '--install-driver', "$PWD\driver.json"
          Get-Content driver.json
          if ($p.ExitCode -ne 0) { exit 1 }
          $listed = pnputil /enum-drivers | Select-String -Context 0,6 'ps5cable.inf'
          $listed
          if (-not ($listed | Out-String).Contains('PS5 Cable')) { exit 1 }

      - name: Package
        shell: bash
        run: |
          mkdir -p out/ps5cable
          cp dist/ps5cable-hub.exe dist/ps5cable.exe payload/ps5cable.elf \
             converter/target/release/ps5cable-convert.exe \
             pc/ps5cable.py pc/usblink.py pc/convert.py pc/hub.py pc/hub_ui.html pc/start-hub.bat \
             pc/requirements.txt README.md LICENSE out/ps5cable/
          (cd out && 7z a -bd ps5cable-windows.zip ps5cable > /dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: ps5cable-windows
          path: out/ps5cable-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-app, macos-app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum ps5cable.elf ps5cable-windows.zip ps5cable-linux-x64.tar.gz \
                    ps5cable-macos-arm64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $pre \
             --title "ps5cable $GITHUB_REF_NAME" --notes-file ../.github/release-notes.md \
             ps5cable-windows.zip ps5cable-linux-x64.tar.gz ps5cable-macos-arm64.tar.gz \
             ps5cable.elf SHA256SUMS.txt
