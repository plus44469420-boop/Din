<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bluetooth pairing</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141414;
        color: #f2efe9;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        box-sizing: border-box;
        padding: 20px 18px 16px;
        display: flex;
        flex-direction: column;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 14px;
        color: #b9b3aa;
        font-size: 14px;
        line-height: 1.4;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #242424;
        color: inherit;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
      }
      .actions {
        margin-top: auto;
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #f2efe9;
        color: #141414;
        border: 0;
        font-weight: 600;
      }
      button.cancel {
        background: transparent;
        color: #f2efe9;
        border: 1px solid #3a3a3a;
      }
    </style>
  </head>
  <body>
    <h1>Bluetooth pairing</h1>
    <p id="message">Confirm pairing with this device.</p>
    <input id="pin" type="text" inputmode="numeric" autocomplete="off" hidden />
    <div class="actions">
      <button class="cancel" id="cancel" type="button">Cancel</button>
      <button class="primary" id="pair" type="button">Pair</button>
    </div>
    <script src="pairing.js"></script>
  </body>
</html>
