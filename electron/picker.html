<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect a device</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141414;
        color: #f2efe9;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 20px 18px 16px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0 0 16px;
        color: #b9b3aa;
        font-size: 13px;
        line-height: 1.4;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        flex: 1;
        overflow: auto;
      }
      button.device,
      button.cancel {
        width: 100%;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        font: inherit;
      }
      button.device {
        text-align: left;
        background: #242424;
        color: inherit;
        padding: 12px 14px;
        margin-bottom: 8px;
      }
      button.device:hover,
      button.device:focus-visible {
        background: #303030;
        outline: none;
      }
      .name {
        display: block;
        font-size: 15px;
      }
      .id {
        display: block;
        margin-top: 2px;
        color: #8e887f;
        font-size: 12px;
      }
      .empty {
        color: #8e887f;
        font-size: 14px;
      }
      button.cancel {
        margin-top: 12px;
        background: transparent;
        color: #f2efe9;
        border: 1px solid #3a3a3a;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <h1>Connect a device</h1>
    <p>Select your Puffco. It needs to be powered on and nearby.</p>
    <ul id="list">
      <li class="empty">Searching for nearby devices…</li>
    </ul>
    <button class="cancel" id="cancel" type="button">Cancel</button>
    <script src="picker.js"></script>
  </body>
</html>
