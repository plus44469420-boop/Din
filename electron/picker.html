<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Connect a device</title>
    <style>
      html, body { margin: 0; height: 100%; background: #141414; color: #f2efe9; font-family: "Segoe UI", sans-serif; }
      body { display: flex; flex-direction: column; padding: 20px 18px 16px; box-sizing: border-box; }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0 0 16px; color: #b9b3aa; font-size: 13px; }
      ul { list-style: none; margin: 0; padding: 0; flex: 1; overflow: auto; }
      button { font: inherit; cursor: pointer; border-radius: 10px; }
      button.device { display: block; width: 100%; text-align: left; background: #242424; color: inherit; border: 0; padding: 12px 14px; margin-bottom: 8px; }
      button.cancel { margin-top: 12px; width: 100%; background: transparent; color: inherit; border: 1px solid #3a3a3a; padding: 10px 12px; }
      .empty { color: #8e887f; }
    </style>
  </head>
  <body>
    <h1>Connect a device</h1>
    <p>Select your Puffco. It needs to be powered on and nearby.</p>
    <ul id="list"><li class="empty">Searching for nearby devices…</li></ul>
    <button class="cancel" id="cancel" type="button">Cancel</button>
    <script src="picker.js"></script>
  </body>
</html>
