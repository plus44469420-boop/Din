function cvOptions() {
  const cv = app.cv;
  const req = { make: cv.make, source: cv.source.trim(), output_dir: cv.output_dir.trim(), full_verify: cv.full_verify };
  if (cv.make === "pkg") Object.assign(req, { compression: cv.compression, language: cv.language, content_id: cv.content_id, name: cv.name, firmware: cv.firmware, passcode: cv.passcode });
  else if (cv.make === "image") {
    const lz4 = cv.format === "exfat" && cv.lz4;
    Object.assign(req, { format: cv.format, compress: !lz4 && cv.compress, lz4, verify_chunk_kib: cv.verify_chunk_kib });
    if (lz4) Object.assign(req, { lz4_install_runtime: cv.lz4_install_runtime, lz4_profile: cv.lz4_profile });
  } else req.name = cv.name;
  return req;
}

async function cvStart() {
  try {
    const job = await api("POST", "/api/convert/start", cvOptions());
    app.settings = (await api("GET", "/api/state")).settings;
    toast(job.state === "queued" && app.cvJobs.some((j) => j.state === "running") ? "Added to the queue" : "Converting…", "ok");
    pollConvert();
  } catch (e) { toast(e.message, "err"); }
}

async function cvSend(j) {
  const def = j.make === "pkg" ? "/user/data/ps5upload/pkg_library" : "/data/homebrew";
  const dest = await modal({ title: "Send to the PS5", input: remote.path && remote.path !== "/" ? remote.path : def, okText: "Send",
    text: j.make === "pkg" ? "Copies the package to this PS5 folder. Install it afterwards with etaHEN's package installer or ps5upload."
      : "Copies it to this PS5 folder. ShadowMount+ mounts game images from /data/homebrew (and the other folders under Game folders)." });
  if (!dest) return;
  try {
    await api("POST", "/api/remote/mkdir", { path: dest }).catch(() => {});
    await api("POST", "/api/convert/send", { id: j.id, dest });
    $("transfers").classList.remove("collapsed");
    toast("Sending to the PS5 — see Transfers", "ok");
    pollJobs();
  } catch (e) { toast(e.message, "err"); }
}

function cvRenderQueue() {
  const right = $("cv-right");
  if (!right) return;
  const cv = app.cv, jobs = app.cvJobs || [];
  const running = jobs.some((j) => j.state === "running");
  const startLabel = { pkg: "Make package", image: "Make game image", folder: "Make folder" }[cv.make];
  const run = el("div", { class: "card" }, el("h3", {}, "④ Run"),
    el("div", { class: "row-flex" },
      el("button", { class: "primary", onclick: cvStart, disabled: !cv.source.trim() }, running ? `Add to queue: ${startLabel}` : startLabel),
      el("button", { class: "ghost", onclick: async () => { app.cvJobs = (await api("POST", "/api/convert/clear", {})).jobs; cvRenderQueue(); } }, "Clear finished")),
    app.cvConverter === "" ? el("div", { class: "err-text" }, "The converter is missing next to the app, so nothing can be converted.") : null,
    el("div", { class: "hint" }, "Conversions run one at a time on this PC; the PS5 doesn't need to be connected until you send the result."));
  const list = jobs.map((j) => {
    const name = (j.source || "").split(/[\\/]/).filter(Boolean).pop();
    const what = CV_MAKE_LABEL[j.make] + (j.make === "image" ? ` .${j.options.compress ? "ffpfsc" : j.options.format}${j.options.lz4 ? " + LZ4" : ""}` : j.make === "pkg" ? ` · ${j.options.compression}` : "");
    const pct = j.state === "done" ? 100 : j.percent || 0;
    const status = { queued: "Queued", running: `${j.stage_label || "Starting"}… ${j.total ? `${human(j.done)} of ${human(j.total)}` : ""}`, done: "Done", failed: "Failed", cancelled: "Cancelled" }[j.state];
    const box = el("div", { class: "cvjob " + j.state },
      el("div", { class: "top" }, el("b", { title: j.source }, name), el("span", { class: "tag" + (j.state === "done" ? " green" : "") }, what),
        ["queued", "running"].includes(j.state) ? el("button", { class: "ghost", onclick: () => api("POST", "/api/convert/cancel", { id: j.id }).then(pollConvert).catch((e) => toast(e.message, "err")) }, "Cancel") : null),
      el("div", { class: "bar" }, el("i", { style: `width:${pct.toFixed(1)}%` })),
      el("small", {}, status + (j.stage_count && j.state === "running" ? ` · step ${j.stage_index + 1} of ${j.stage_count}` : "")));
    if (j.state === "done" && j.result) {
      const r = j.result;
      box.append(el("code", {}, r.path), el("small", {}, `${human(r.size)} · ${r.files != null ? r.files + " files · " : ""}${fmtEta((r.elapsed_ms || 0) / 1000)}${r.detail ? " · " + r.detail : ""}`));
      if (r.warnings && r.warnings.length) box.append(el("small", { class: "warn-text" }, r.warnings.join(" · ")));
      box.append(el("div", { class: "row-flex" },
        el("button", { onclick: () => api("POST", "/api/local/open", { path: r.path.replace(/[\\/][^\\/]+$/, "") }).catch((e) => toast(e.message, "err")) }, "Show in folder"),
        el("button", { class: "primary", disabled: !app.connected, title: app.connected ? "" : "Connect to the PS5 first", onclick: () => cvSend(j) }, "Send to PS5")));
    }
    if (j.state === "failed") {
      const hint = /already exists/i.test(j.error || "") ? " — delete or rename it, or pick another output folder." : "";
      box.append(el("small", { class: "err-text" }, j.error + hint));
    }
    return box;
  });
  right.replaceChildren(run, ...list);
}

let cvTimer = null;
async function pollConvert() {
  clearTimeout(cvTimer);
  try {
    const d = await api("GET", "/api/convert/jobs");
    const before = new Map((app.cvJobs || []).map((j) => [j.id, j.state]));
    app.cvJobs = d.jobs; app.cvConverter = d.converter;
    for (const j of d.jobs) {
      const was = before.get(j.id);
      if (was && was !== j.state && j.state === "done") toast(`Converted: ${j.result.path}`, "ok");
      if (was && was !== j.state && j.state === "failed") toast(`Conversion failed: ${j.error}`, "err");
    }
    cvRenderQueue();
    const active = d.jobs.some((j) => ["queued", "running"].includes(j.state));
    $("btn-convert").classList.toggle("busy", active);
    if (active || $("cv-bg")) cvTimer = setTimeout(pollConvert, active ? 700 : 3000);
  } catch (e) { cvTimer = setTimeout(pollConvert, 3000); }
}

// ---------------------------------------------------------------- transfers

async function startTransfer(direction) {
  const src = direction === "upload" ? local : remote, dst = direction === "upload" ? remote : local;
  if (!src.sel.size || !dst.path) return;
  try {
    await api("POST", "/api/transfer", {
      direction, sources: src.selectedPaths(), dest: dst.path,
      resume: $("opt-resume").checked, jobs: Number($("opt-jobs").value) || 4,
    });
    src.sel.clear(); src.renderList();
    $("transfers").classList.remove("collapsed");
    pollJobs();
  } catch (e) { toast(e.message, "err"); }
}

function jobCard(j) {
  const pct = j.total ? (100 * j.done / j.total) : (j.state === "done" ? 100 : 0);
  const names = j.sources.map((s) => s.split(/[\\/]/).filter(Boolean).pop() || s);
  const title = names.length > 1 ? `${names[0]} + ${names.length - 1} more` : names[0];
  const up = j.direction === "upload", onPs5 = j.direction === "copy" || j.direction === "move";
  const label = { upload: "PC → PS5", download: "PS5 → PC", copy: "Copy on PS5", move: "Move on PS5" }[j.direction];
  const stateText = { planning: "Scanning…", running: `${pct.toFixed(1)}%`, done: "Done", failed: "Finished with errors", cancelled: "Cancelled" }[j.state];
  const meta = el("div", { class: "meta" },
    el("span", { class: `state-${j.state}` }, stateText),
    j.files_total || !j.renamed ? el("span", {}, `${human(j.done)} / ${human(j.total)}`) : null,
    j.files_total || !j.renamed ? el("span", {}, `${j.files_done} / ${j.files_total} files`) : null,
    j.state === "running" ? el("span", {}, `${human(j.rate)}/s`) : null,
    j.state === "running" ? el("span", {}, `ETA ${fmtEta(j.eta)}`) : null,
    j.state !== "running" && j.finished ? el("span", {}, `took ${fmtEta(j.finished - j.started)}`) : null,
    j.skipped ? el("span", {}, `${j.skipped} already there, skipped`) : null,
    j.renamed ? el("span", {}, `${j.renamed} moved instantly (same drive)`) : null,
    el("span", { style: "margin-left:auto; overflow:hidden; text-overflow:ellipsis" }, `→ ${j.dest}`));
  const card = el("div", { class: `job ${j.state}` },
    el("div", { class: "job-top" },
      el("span", { class: "dir" + (up ? "" : onPs5 ? " on-ps5" : " down") }, label),
      el("span", { class: "title", title: j.sources.join("\n") }, title),
      (j.state === "running" || j.state === "planning")
        ? el("button", { class: "ghost danger", onclick: () => api("POST", "/api/jobs/cancel", { id: j.id }).catch((e) => toast(e.message, "err")) }, "Cancel")
        : null),
    el("div", { class: "bar" }, el("i", { style: `width:${pct}%` })),
    meta);
  if (j.error_count) {
    card.append(el("details", {}, el("summary", {}, `${j.error_count} error${j.error_count > 1 ? "s" : ""}`),
      el("pre", {}, j.errors.map((e) => (e.file ? e.file + ": " : "") + e.error).join("\n"))));
  }
  return card;
}

function renderJobs() {
  const box = $("jobs");
  box.innerHTML = "";
  if (!app.jobs.length) box.append(el("div", { class: "no-jobs" }, "Nothing yet. Select files on one side and send them to the other — or drag them across."));
  for (const j of app.jobs) box.append(jobCard(j));
  const active = app.jobs.filter((j) => j.state === "running" || j.state === "planning").length;
  $("tx-badge").hidden = !active;
  $("tx-badge").textContent = active;
}

let pollTimer = null;
async function pollJobs() {
  clearTimeout(pollTimer);
  try {
    const { jobs } = await api("GET", "/api/jobs");
    app.jobs = jobs;
    for (const j of jobs) {
      if (["done", "failed", "cancelled"].includes(j.state) && !app.seenDone.has(j.id)) {
        app.seenDone.add(j.id);
        const onPs5 = j.direction === "copy" || j.direction === "move";
        if (j.state === "done" && j.direction === "move") toast(`Moved ${j.sources.length} item${j.sources.length === 1 ? "" : "s"} to ${j.dest}`, "ok");
        else if (j.state === "done") toast(`${{ upload: "Sent", download: "Copied", copy: "Copied on the PS5:" }[j.direction]} ${j.files_total} file${j.files_total === 1 ? "" : "s"} (${human(j.total)})`, "ok");
        else if (j.state === "failed") toast(`${onPs5 ? (j.direction === "move" ? "Move" : "Copy") : "Transfer"} finished with ${j.error_count} error(s)`, "err");
        const target = j.direction === "download" ? local : remote;
        target.load(target.path);
        if (onPs5) loadRemotePlaces(true);
      }
    }
    renderJobs();
  } catch (e) { /* hub briefly unreachable */ }
  const active = app.jobs.some((j) => j.state === "running" || j.state === "planning");
  pollTimer = setTimeout(pollJobs, active ? 500 : 3000);
}

// ---------------------------------------------------------------- boot

async function boot() {
  const st = await api("GET", "/api/state");
  app.settings = st.settings;
  app.os = st.os;
  app.payloadPath = st.payload;
  app.usbGuide = st.usb_guide;
  app.canInstallDriver = st.can_install_driver;
  $("opt-resume").checked = !!st.settings.resume;
  $("opt-jobs").value = st.settings.jobs;
  local.places = st.local_places;
  remote.places = [{ name: "Internal", path: "/data" }, { name: "Homebrew", path: "/data/homebrew" }];
  local.load(st.settings.local_dir);
  remote.renderPlaces();
  applyStatus(st.status);
  pollJobs();
}

$("btn-convert").addEventListener("click", () => openConvert());
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("cv-bg") && !document.querySelector(".modal-bg")) closeConvert(); });
$("cable").addEventListener("click", openCablePanel);
$("btn-upload").addEventListener("click", () => startTransfer("upload"));
$("btn-download").addEventListener("click", () => startTransfer("download"));
$("btn-clear").addEventListener("click", async () => { app.jobs = (await api("POST", "/api/jobs/clear", {})).jobs; renderJobs(); });
$("btn-collapse").addEventListener("click", () => $("transfers").classList.toggle("collapsed"));
$("btn-quit").addEventListener("click", async () => {
  if (app.jobs.some((j) => j.state === "running") && !(await modal({ title: "Quit while transfers are running?", okText: "Quit", danger: true }))) return;
  await api("POST", "/api/quit", {}).catch(() => {});
  document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;color:#8b95a7">PS5 Cable closed. You can close this window.</div>';
});
$("opt-resume").addEventListener("change", (e) => api("POST", "/api/settings", { resume: e.target.checked }));
$("opt-jobs").addEventListener("change", (e) => api("POST", "/api/settings", { jobs: Number(e.target.value) || 4 }));
$("opt-hidden").addEventListener("change", (e) => { app.showHidden = e.target.checked; local.renderList(); remote.renderList(); });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || document.querySelector(".modal-bg, .cv-bg")) return;
  const pane = app.activePane || remote, mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === "a") { e.preventDefault(); pane.visible().forEach((x) => pane.sel.add(x.name)); pane.renderList(); return; }
  if (e.key === "Backspace" && pane.parent) { e.preventDefault(); pane.load(pane.parent); return; }
  if (e.key === "Enter" && pane.sel.size === 1) {
    const ent = pane.entries.find((x) => pane.sel.has(x.name));
    if (ent && ent.dir) pane.load(pane.join(ent.name));
    return;
  }
  if (pane !== remote || !app.connected) return;
  const locked = remote.lockedSelection();
  if (e.key === "Delete" && remote.sel.size && !locked) remote.remove();
  else if (e.key === "F2" && remote.sel.size === 1 && !locked) { e.preventDefault(); remote.rename(); }
  else if (mod && k === "c" && remote.sel.size && !String(window.getSelection())) remote.setClip(false);
  else if (mod && k === "x" && remote.sel.size && !locked) remote.setClip(true);
  else if (mod && k === "v" && app.clip) { e.preventDefault(); remote.paste(); }
  else if (e.key === "Escape" && app.clip) { app.clip = null; remote.renderList(); }
});

boot().catch((e) => toast(e.message, "err"));
</script>
</body>
