<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Cable</title>
<style>
  :root {
    --bg: #090c13;
    --panel: #10151f;
    --panel-2: #151b27;
    --row-hover: #1a2231;
    --row-sel: #12305a;
    --border: #222b3a;
    --text: #e6eaf2;
    --muted: #8b95a7;
    --accent: #2f7cf6;
    --accent-2: #5a9bff;
    --ok: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #13284d 0%, transparent 60%), var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
    user-select: none;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, border-color .12s, opacity .12s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #1d2534; border-color: #2e3a4f; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
  button.ghost { background: transparent; border-color: transparent; }
  button.ghost:hover:not(:disabled) { background: var(--panel-2); border-color: var(--border); }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: #fecaca; }
  button.icon { padding: 6px; }
  input[type=text], input[type=search], input[type=number] {
    background: #0c111a; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #2f7cf633; }
  svg { width: 16px; height: 16px; flex: none; }

  /* header */
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--border); background: #0b1019cc; backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
  @media (max-width: 1400px) { .brand small { display: none; } }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, #2f7cf6, #7c3aed); box-shadow: 0 4px 18px #2f7cf655;
  }
  .brand .logo svg { width: 18px; height: 18px; color: #fff; }
  .brand small { color: var(--muted); font-weight: 500; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px #ef444422; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px #22c55e22; }
  .link {
    display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 10px; border-radius: 12px;
    border: 1px solid #5b1f24; background: linear-gradient(180deg, #2a1215, #1b0d10); min-width: 230px;
    transition: background .25s, border-color .25s;
  }
  .link .lamp {
    width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--bad);
    box-shadow: 0 0 0 4px #ef444426, 0 0 12px #ef444480;
  }
  .link .txt { display: grid; line-height: 1.15; min-width: 0; }
  .link .txt b { font-size: 14px; letter-spacing: .3px; color: #fecaca; }
  .link .txt small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  .link.ok { border-color: #1f6b3a; background: linear-gradient(180deg, #0f2b1a, #0b1d13); }
  .link.ok .lamp { background: var(--ok); box-shadow: 0 0 0 4px #22c55e2e, 0 0 16px #22c55eaa; animation: glow 2.4s ease-in-out infinite; }
  .link.ok .txt b { color: #86efac; }
  .link.warn { border-color: #6b4a12; background: linear-gradient(180deg, #2b210c, #1c1609); }
  .link.warn .lamp { background: var(--warn); box-shadow: 0 0 0 4px #f59e0b2e, 0 0 14px #f59e0b99; animation: blink 1s ease-in-out infinite; }
  .link.warn .txt b { color: #fcd34d; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px #22c55e1f, 0 0 22px #22c55ecc; } }
  @keyframes blink { 50% { opacity: .45; } }
  .cable {
    display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 9px; border-radius: 12px; min-width: 0;
    border: 1px solid var(--border); background: var(--panel); text-align: left;
  }
  .cable svg { width: 18px; height: 18px; color: var(--muted); }
  .cable .txt { display: grid; line-height: 1.15; min-width: 0; }
  .cable .txt b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .cable .txt small { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .cable.ok { border-color: #1f6b3a; } .cable.ok svg { color: var(--ok); }
  .cable.warn { border-color: #6b4a12; } .cable.warn svg { color: var(--warn); } .cable.warn .txt small { color: #fcd34d; }
  .cable.bad { border-color: #7f1d1d; } .cable.bad svg { color: var(--bad); } .cable.bad .txt small { color: #fca5a5; }
  .modal.wide { width: 640px; }
  .facts { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .facts dd.hl { font-weight: 700; }
  .bars { display: grid; gap: 8px; }
  .bars .b { display: grid; grid-template-columns: 250px 1fr 82px; align-items: center; gap: 10px; font-size: 12.5px; }
  .bars .track { height: 8px; border-radius: 99px; background: #0c111a; overflow: hidden; }
  .bars .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .bars .b.limit .track i { background: var(--warn); }
  .bars .b span:last-child { text-align: right; font-family: var(--mono); }
  .notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: #cbd5e1; }
  .notes.ok li::marker { color: var(--ok); } .notes.warn li::marker { color: var(--warn); } .notes.bad li::marker { color: var(--bad); }
  .st-result { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #0c111a; }
  .st-result .nums { display: flex; gap: 22px; font-size: 13px; }
  .st-result .nums b { font-size: 18px; font-family: var(--mono); }
  /* convert */
  #btn-convert.busy { color: #93c5fd; border-color: #2f7cf655; background: #12305a55; }
  .cv-bg { position: fixed; inset: 0; z-index: 35; background: #05080dd9; backdrop-filter: blur(3px); display: grid; padding: 22px; }
  .cv { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; display: grid; grid-template-rows: auto 1fr; overflow: hidden; box-shadow: 0 30px 80px #000c; }
  .cv-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .cv-head h2 { margin: 0; font-size: 17px; }
  .cv-head small { color: var(--muted); }
  .cv-body { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(340px, 1fr); gap: 16px; padding: 16px; overflow: auto; align-items: start; }
  .cv-col { display: grid; gap: 14px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
  .card h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .card .hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .card .warn-text { color: #fcd34d; font-size: 12px; }
  .card .err-text { color: #fca5a5; font-size: 12px; }
  .row-flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row-flex input[type=text] { flex: 1; min-width: 180px; }
  .tiles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile { display: grid; gap: 4px; align-content: start; text-align: left; padding: 10px 12px; border-radius: 10px; white-space: normal; background: var(--panel-2); }
  .tile b { font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tile span { color: var(--muted); font-size: 11.5px; line-height: 1.4; }
  .tile.on { border-color: var(--accent); background: #12305a66; box-shadow: 0 0 0 1px #2f7cf655 inset; }
  .tag { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: #12305a; color: #93c5fd; }
  .tag.green { background: #12351f; color: #86efac; }
  .tag.new { background: #3b2a0c; color: #fcd34d; }
  .check { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; cursor: pointer; }
  .check input { margin-top: 2px; }
  .check small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
  .check.disabled { opacity: .5; cursor: default; }
  .field { display: grid; gap: 4px; font-size: 12.5px; }
  .field > span { color: var(--muted); }
  select { background: #0c111a; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks { display: grid; gap: 3px; font-size: 12px; max-height: 170px; overflow: auto; }
  .checks div { display: flex; gap: 6px; } .checks .ok::before { content: "✓"; color: var(--ok); } .checks .bad::before { content: "!"; color: var(--warn); font-weight: 700; padding: 0 2px; }
  .facts.small { grid-template-columns: 120px 1fr; font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .cvjob { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: var(--panel-2); }
  .cvjob .top { display: flex; gap: 8px; align-items: center; }
  .cvjob .top b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cvjob .bar { height: 6px; background: #0c111a; border-radius: 99px; overflow: hidden; }
  .cvjob .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .cvjob.done .bar i { background: var(--ok); } .cvjob.failed .bar i { background: var(--bad); }
  .cvjob small { color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
  .cvjob code { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
  .pane-head .linkchip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #3a1418; color: #fca5a5; }
  .pane-head .linkchip.ok { background: #12351f; color: #86efac; }
  .menu {
    position: fixed; z-index: 30; background: #111827; border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 18px 50px #000b; width: 430px; max-height: 70vh; overflow: auto; padding: 6px;
  }
  .menu h4 { margin: 8px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .menu button { width: 100%; display: grid; grid-template-columns: 1fr auto; text-align: left; border: none; background: transparent; padding: 8px 10px; border-radius: 8px; gap: 2px 10px; }
  .menu button:hover { background: var(--row-hover); }
  .menu code { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
  .menu small { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; }
  .menu .tag { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: #1b2a44; color: #9cc2ff; align-self: center; }
  .menu .tag.new { background: #2a2414; color: #fcd34d; }
  .menu.ctx { width: 250px; }
  .menu.ctx button { grid-template-columns: 18px 1fr auto; align-items: center; padding: 6px 10px; }
  .menu.ctx button svg { width: 15px; height: 15px; color: var(--muted); }
  .menu.ctx button.danger svg { color: #f87171; }
  .menu.ctx kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .menu.ctx hr { border: none; border-top: 1px solid var(--border); margin: 4px 6px; }
  .menu.ctx button:disabled { opacity: .4; }
  tr.cut { opacity: .45; }
  tr.locked td.name span::after { content: " 🔒"; font-size: 11px; opacity: .7; }
  .size-sum { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .size-sum b { font-size: 22px; color: var(--text); font-family: var(--mono); }
  .size-sum ul { margin: 0; padding-left: 18px; max-height: 200px; overflow: auto; }
  .size-sum li { display: flex; gap: 10px; } .size-sum li span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail .tip { font-size: 11.5px; color: #fcd34d; background: #2a210c; border: 1px solid #6b4a12; border-radius: 10px; padding: 8px 10px; line-height: 1.35; }

  .spacer { flex: 1; }
  .meter { display: flex; flex-direction: column; gap: 4px; min-width: 190px; font-size: 12px; color: var(--muted); }
  .bar { height: 6px; border-radius: 99px; background: #1b2332; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #7c3aed); width: 0; transition: width .3s; }

  /* panes */
  main { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; padding: 14px 18px; min-height: 0; }
  .pane {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    display: grid; grid-template-rows: auto auto auto 1fr auto; min-height: 0; overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  .pane.drop { border-color: var(--accent); box-shadow: 0 0 0 4px #2f7cf633 inset; }
  .pane-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .pane-head h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .pane-head h2 svg { width: 18px; height: 18px; color: var(--accent-2); }
  .pane-head .free { color: var(--muted); font-size: 12px; margin-left: auto; }
  .places { display: flex; gap: 6px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
  .places::-webkit-scrollbar { display: none; }
  .chip {
    border-radius: 999px; padding: 3px 10px; font-size: 12px; background: #0c111a; color: var(--muted);
  }
  .chip.active, .chip:hover { color: var(--text); border-color: #34445e; }
  .toolbar { display: flex; gap: 6px; padding: 0 14px 10px; align-items: center; }
  .crumbs {
    flex: 1; display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden;
    background: #0c111a; border: 1px solid var(--border); border-radius: 8px; padding: 3px 6px; cursor: text;
  }
  .crumbs button { padding: 2px 6px; border: none; background: transparent; border-radius: 6px; color: var(--muted); font-size: 13px; }
  .crumbs button:hover { background: var(--panel-2); color: var(--text); }
  .crumbs button:last-child { color: var(--text); font-weight: 600; }
  .crumbs .sep { color: #3b475b; }
  .crumbs input { flex: 1; border: none; background: transparent; padding: 3px 4px; font-family: var(--mono); font-size: 13px; }
  .crumbs input:focus { box-shadow: none; }
  .filter { width: 150px; }

  .list { overflow: auto; min-height: 0; border-top: 1px solid var(--border); position: relative; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-weight: 600;
    color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  thead th.sorted { color: var(--text); }
  th.cb, td.cb { width: 38px; text-align: center; padding-left: 12px; }
  th.size, td.size { width: 96px; text-align: right; }
  th.date, td.date { width: 156px; }
  tbody tr { cursor: default; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.sel { background: var(--row-sel); }
  td { padding: 6px 10px; border-bottom: 1px solid #161d2a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.size, td.date { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  td.name { display: flex; align-items: center; gap: 8px; }
  td.name span { overflow: hidden; text-overflow: ellipsis; }
  td.name svg { color: #94a3b8; }
  tr.dir td.name svg { color: #f7c948; }
  tr.hidden-file { opacity: .55; }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  .pane-foot {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border);
    background: var(--panel-2); color: var(--muted); font-size: 13px;
  }
  .pane-foot .grow { flex: 1; }

  .empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; color: var(--muted); }
  .empty .card { max-width: 380px; display: grid; gap: 12px; justify-items: center; }
  .empty h3 { margin: 0; color: var(--text); font-size: 16px; }
  .empty ol { text-align: left; margin: 0; padding-left: 20px; line-height: 1.8; }
  .empty ol.steps { list-style: none; padding: 0; display: grid; gap: 8px; }
  .steps li { display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .steps .tick { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #334155; display: grid; place-items: center; font-size: 12px; flex: none; }
  .steps li.done { color: var(--text); }
  table.ctypes { border-collapse: collapse; font-size: 12.5px; width: 100%; text-align: left; }
  table.ctypes th, table.ctypes td { padding: 5px 8px; border-top: 1px solid var(--border); vertical-align: top; }
  table.ctypes th { color: var(--muted); font-weight: 600; border-top: none; }
  table.ctypes td:first-child { white-space: nowrap; font-weight: 600; }
  .usblist { width: 100%; text-align: left; display: grid; gap: 6px; font-size: 12.5px; }
  .usblist .head { display: flex; justify-content: space-between; gap: 8px; color: var(--text); }
  .usblist .head small { color: var(--muted); }
  .usblist ul { list-style: none; margin: 0; padding: 0; max-height: 170px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  .usblist li { display: grid; padding: 6px 10px; border-top: 1px solid #161d2a; }
  .usblist li:first-child { border-top: none; }
  .usblist li b { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .usblist li small { color: var(--muted); font-size: 11.5px; }
  .usblist li.bridge { background: #0f2b1a; } .usblist li.bridge b { color: #86efac; }
  .usblist p { margin: 0; }
  .usblist .warn-text, .usblist.err-text { font-size: 12px; } .usblist .warn-text { color: #fcd34d; } .usblist.err-text { color: #fca5a5; }
  .guide { text-align: left; display: grid; gap: 8px; }
  .guide p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .steps li.done .tick { background: var(--ok); border-color: var(--ok); color: #052e14; font-weight: 800; }
  .steps li.active { color: #fcd34d; }
  .steps li.active .tick { border-color: var(--warn); animation: blink 1s ease-in-out infinite; }
  .empty .big { width: 46px; height: 46px; color: #3b475b; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; background: #10151f99; }
  .spin { width: 26px; height: 26px; border: 3px solid #2a3446; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* center rail */
  .rail { display: flex; flex-direction: column; justify-content: center; gap: 12px; width: 150px; }
  .rail button { justify-content: center; padding: 12px; border-radius: 12px; flex-direction: column; gap: 4px; }
  .rail button svg { width: 22px; height: 22px; }
  .rail button small { font-weight: 400; opacity: .85; font-size: 11px; }
  .rail .opts { display: grid; gap: 8px; font-size: 12px; color: var(--muted); padding: 10px; border: 1px dashed var(--border); border-radius: 12px; }
  .rail .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .rail .opts input[type=number] { width: 52px; padding: 3px 6px; }

  /* transfers */
  .transfers { border-top: 1px solid var(--border); background: #0b1019; max-height: 34vh; display: grid; grid-template-rows: auto 1fr; }
  .transfers.collapsed .jobs { display: none; }
  .tx-head { display: flex; align-items: center; gap: 10px; padding: 8px 18px; }
  .tx-head h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 8px; font-weight: 700; }
  .jobs { overflow: auto; padding: 0 18px 12px; display: grid; gap: 8px; }
  .job { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
  .job-top { display: flex; align-items: center; gap: 10px; }
  .job-top .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .job-top .dir { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #1b2a44; color: #9cc2ff; font-weight: 700; }
  .job-top .dir.down { background: #1d3326; color: #86efac; }
  .job-top .dir.on-ps5 { background: #2a1f3d; color: #d8b4fe; }
  .job .meta { display: flex; gap: 16px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .job .meta .state-done { color: var(--ok); }
  .job .meta .state-failed { color: var(--bad); }
  .job .meta .state-cancelled { color: var(--warn); }
  .job .bar { height: 8px; }
  .job.done .bar > i { background: var(--ok); }
  .job.failed .bar > i { background: var(--bad); }
  .job details { font-size: 12px; color: #fca5a5; }
  .job details pre { margin: 6px 0 0; white-space: pre-wrap; font-family: var(--mono); max-height: 120px; overflow: auto; }
  .no-jobs { color: var(--muted); font-size: 13px; padding: 4px 0 8px; }

  /* toasts & modal */
  .toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 50; }
  .toast {
    background: #121a28; border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 10px; padding: 10px 14px; max-width: 420px; box-shadow: 0 10px 30px #0008; animation: in .18s ease-out;
  }
  .toast.err { border-left-color: var(--bad); }
  .toast.ok { border-left-color: var(--ok); }
  @keyframes in { from { transform: translateY(8px); opacity: 0; } }
  .modal-bg { position: fixed; inset: 0; background: #0009; display: grid; place-items: center; z-index: 40; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; width: 420px; display: grid; gap: 14px; box-shadow: 0 20px 60px #000a; }
  .modal h3 { margin: 0; }
  .modal p { margin: 0; color: var(--muted); word-break: break-all; white-space: pre-line; }
  button.primary.danger { background: var(--bad); border-color: var(--bad); }
  button.primary.danger:hover:not(:disabled) { background: #f87171; border-color: #f87171; color: #fff; }
  .modal .row { display: flex; justify-content: flex-end; gap: 8px; }
  .modal input { width: 100%; }
</style>
</head>
<body>
<header>

    <span class="txt"><b id="cable-title">USB bridge cable</b><small id="cable-sub"></small></span>
  </button>
  <button class="ghost" id="btn-convert" title="Convert games: package, game image (.ffpkg/.exfat/.ffpfs/.ffpfsc) or folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-3-3M20 17H9l3 3"/><rect x="15" y="3" width="6" height="8" rx="1"/><rect x="3" y="13" width="6" height="8" rx="1"/></svg>Convert</button>
  <div class="spacer"></div>

    <div class="bar"><i id="ps5-used"></i></div>
    <div id="ps5-free"></div>
  </div>
  <button class="ghost icon" id="btn-quit" title="Quit PS5 Cable"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v9M6.3 6.3a8 8 0 1011.4 0"/></svg></button>
</header>

<main>
  <section class="pane" id="pane-local"></section>
  <div class="rail">
    <button class="primary" id="btn-upload" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14m-5-5l5 5-5 5"/></svg>
      Send to PS5<small id="up-sum">select files on the PC</small>
    </button>
    <button id="btn-download" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5m5 5l-5-5 5-5"/></svg>
      Copy to PC<small id="down-sum">select files on the PS5</small>
    </button>
    <div class="opts">
      <label title="Skip files that are already complete and continue partial ones"><input type="checkbox" id="opt-resume"> Skip / resume existing</label>
      <label title="Parallel connections. More helps with many small files">Parallel <input type="number" id="opt-jobs" min="1" max="16"></label>
      <label><input type="checkbox" id="opt-hidden"> Show hidden</label>
    </div>
    <div class="tip" id="pkg-tip" hidden></div>
  </div>
  <section class="pane" id="pane-remote"></section>
</main>

<section class="transfers" id="transfers">
  <div class="tx-head">
    <h3>Transfers</h3><span class="badge" id="tx-badge" hidden>0</span>
    <div class="spacer"></div>

    <button class="ghost icon" id="btn-collapse" title="Collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>

</section>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
const TOKEN = "__HUB_TOKEN__";

const ICONS = {
  pc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  ps5: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3c3 1 5 3 5 6v12M9 3v14l-5-2M14 13l6 2-6 3"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-6 6l6-6 6 6"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>',
  newdir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2zM12 10v6m-3-3h6"/></svg>',
  rename: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0l1 13h8l1-13"/></svg>',
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 011-1h10"/></svg>',
  cut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.1 15.9L20 4M15.9 15.9L4 4"/></svg>',
  paste: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 13h6m-2-2.5l2.5 2.5-2.5 2.5"/></svg>',
  size: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-9-9v9z"/><path d="M15 3.5A9 9 0 0120.5 9H15z"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0l-4-4m4 4l4-4M5 20h14"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>',
  plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 2v5m6-5v5M7 7h10v4a5 5 0 01-10 0zM12 16v6"/></svg>',
};

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const $ = (id) => document.getElementById(id);

function human(n) {
  if (n == null) return "";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return i === 0 ? `${n} B` : `${n.toFixed(n < 10 ? 2 : 1)} ${u[i]}`;
}
function fmtDate(t) {
  if (!t) return "";
  const d = new Date(t * 1000), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtEta(s) {
  if (s == null || !isFinite(s)) return "—";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
}

async function api(method, path, body) {
  const opts = { method, headers: { "X-Hub-Token": TOKEN } };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
const qs = (o) => "?" + new URLSearchParams(o).toString();

function toast(msg, kind = "") {
  const t = el("div", { class: `toast ${kind}` }, msg);
  $("toasts").append(t);
  setTimeout(() => t.remove(), kind === "err" ? 7000 : 3500);
}

function modal({ title, text, input, okText = "OK", danger = false, extra }) {
  return new Promise((resolve) => {
    const field = input !== undefined ? el("input", { type: "text", value: input, spellcheck: "false" }) : null;
    const close = (v) => { bg.remove(); resolve(v); };
    const ok = el("button", { class: danger ? "primary danger" : "primary",
      onclick: () => close(field ? field.value : true) }, okText);
    const bg = el("div", { class: "modal-bg", onclick: (e) => { if (e.target === bg) close(null); } },
      el("div", { class: "modal" },
        el("h3", {}, title), text ? el("p", {}, text) : null, extra || null, field,
        el("div", { class: "row" }, el("button", { onclick: () => close(null) }, "Cancel"), ok)));
    document.body.append(bg);
    if (field) {
      field.addEventListener("keydown", (e) => { if (e.key === "Enter") ok.click(); if (e.key === "Escape") close(null); });
      field.focus(); field.select();
    } else ok.focus();
  });
}

// ---------------------------------------------------------------- state

const app = { connected: false, status: null, settings: null, showHidden: false, jobs: [], seenDone: new Set(),
  clip: null, activePane: null };

class Pane {
  constructor(side) {
    this.side = side;               // "local" | "remote"
    this.root = $(`pane-${side}`);
    this.path = null; this.parent = null; this.sep = "/";
    this.entries = []; this.sel = new Set(); this.anchor = null; this.sizes = new Map();
    this.root.addEventListener("mousedown", () => { app.activePane = this; });
    this.sort = { key: "name", dir: 1 }; this.filter = ""; this.places = [];
    this.loading = false; this.error = null; this.editing = false;
    this.build();
  }
  get isLocal() { return this.side === "local"; }
  join(name) {
    if (!this.path) return name;
    return this.path.endsWith(this.sep) ? this.path + name : this.path + this.sep + name;
  }
  build() {
    const r = this.root;
    r.innerHTML = "";
    this.freeEl = el("span", { class: "free" });
    this.linkEl = el("span", { class: "linkchip", hidden: this.isLocal });
    r.append(el("div", { class: "pane-head" },
      el("h2", { html: (this.isLocal ? ICONS.pc : ICONS.ps5) + (this.isLocal ? "This PC" : "PlayStation 5") }),
      this.linkEl, this.freeEl));
    this.placesEl = el("div", { class: "places" });
    r.append(this.placesEl);
    this.crumbsEl = el("div", { class: "crumbs", ondblclick: () => this.editPath() });
    this.filterEl = el("input", { type: "search", class: "filter", placeholder: "Filter",
      oninput: (e) => { this.filter = e.target.value.toLowerCase(); this.renderList(); } });
    const tb = el("div", { class: "toolbar" },
      el("button", { class: "icon", title: "Up one level", html: ICONS.up, onclick: () => this.parent && this.load(this.parent) }),
      this.crumbsEl, this.filterEl,
      this.isLocal ? null : el("button", { title: "Folders where PS5 tools look for games and packages",
        html: ICONS.folder.replace("<svg", '<svg style="color:#f7c948"') + "Game folders",
        onclick: (e) => { e.stopPropagation(); openGameFolders(e.currentTarget); } }),
      el("button", { class: "icon", title: "Refresh", html: ICONS.refresh, onclick: () => this.load(this.path) }));
    r.append(tb);
    this.listEl = el("div", { class: "list" });
    r.append(this.listEl);
    this.sumEl = el("span", { class: "grow" });
    this.actions = el("div", { style: "display:flex; gap:6px" });
    r.append(el("div", { class: "pane-foot" }, this.sumEl, this.actions));

    // drag & drop between panes
    r.addEventListener("dragover", (e) => {
      if (dragSide && dragSide !== this.side) { e.preventDefault(); r.classList.add("drop"); }
    });
    r.addEventListener("dragleave", (e) => { if (!r.contains(e.relatedTarget)) r.classList.remove("drop"); });
    r.addEventListener("drop", (e) => {
      r.classList.remove("drop");
      if (dragSide && dragSide !== this.side) {
        e.preventDefault();
        const from = dragSide;
        dragSide = null;
        startTransfer(from === "local" ? "upload" : "download");
      }
    });
    this.renderActions();
  }
  renderActions() {
    this.actions.innerHTML = "";
    const n = this.sel.size;
    if (this.isLocal) {
      const one = n === 1 ? this.selectedPaths()[0] : null;
      const convertible = one && (CV_IMAGE_EXT.test(one) || this.entries.some((e) => e.dir && this.join(e.name) === one));
      this.actions.append(
        el("button", { class: "ghost", title: "Convert the selected game folder or image (package, game image or folder)", disabled: !convertible,
          html: "Convert…", onclick: () => openConvert(one) }));
      this.actions.append(
        el("button", { class: "ghost", title: "New folder", html: ICONS.newdir + "New folder", onclick: () => this.newFolder() }),
        el("button", { class: "ghost", title: "Open in Explorer/Finder", html: ICONS.open, onclick: () => this.path && api("POST", "/api/local/open", { path: this.path }).catch((e) => toast(e.message, "err")) }));
    } else {
      const off = !app.connected, locked = this.lockedSelection();
      const lockTip = locked ? ` (${locked} is a protected system folder)` : "";
      if (app.clip) {
        this.actions.append(el("button", { class: "ghost", title: `${app.clip.move ? "Move" : "Copy"} ${app.clip.paths.length} item(s) here (Ctrl+V)`,
          html: ICONS.paste + `Paste ${app.clip.paths.length}`, disabled: off || !this.path, onclick: () => this.paste() }));
      }
      this.actions.append(
        el("button", { class: "ghost icon", title: "New folder", html: ICONS.newdir, disabled: off, onclick: () => this.newFolder() }),
        el("button", { class: "ghost icon", title: "Rename (F2)" + lockTip, html: ICONS.rename, disabled: off || n !== 1 || !!locked, onclick: () => this.rename() }),
        el("button", { class: "ghost icon", title: "Size of the selection, or of this folder", html: ICONS.size, disabled: off || !this.path, onclick: () => this.showSize() }),
        el("button", { class: "ghost", title: "Copy to another PS5 folder or drive. The data stays on the console", html: ICONS.copy + "Copy to…",
          disabled: off || n === 0, onclick: (e) => this.copyTo(e.currentTarget, false) }),
        el("button", { class: "ghost", title: "Move to another PS5 folder or drive" + lockTip, html: ICONS.move + "Move to…",
          disabled: off || n === 0 || !!locked, onclick: (e) => this.copyTo(e.currentTarget, true) }),
        el("button", { class: "ghost danger", title: "Delete (Del)" + lockTip, html: ICONS.trash + "Delete", disabled: off || n === 0 || !!locked, onclick: () => this.remove() }));
    }
  }
  renderPlaces() {
    this.placesEl.innerHTML = "";
    for (const p of this.places) {
      this.placesEl.append(el("button", { class: "chip" + (p.path === this.path ? " active" : ""),
        title: p.path, onclick: () => this.load(p.path) }, p.name));
    }
  }
  renderCrumbs() {
    const c = this.crumbsEl;
    c.innerHTML = "";
    if (this.editing) {
      const inp = el("input", { type: "text", value: this.path || "", spellcheck: "false" });
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { this.editing = false; this.load(inp.value.trim()); }
        if (e.key === "Escape") { this.editing = false; this.renderCrumbs(); }
      });
      inp.addEventListener("blur", () => { this.editing = false; this.renderCrumbs(); });
      c.append(inp); inp.focus(); inp.select();
      return;
    }
    if (!this.path) { c.append(el("span", { class: "sep" }, "—")); return; }
    const sep = this.sep;
    let parts, acc;
    if (sep === "\\") {
      parts = this.path.split("\\").filter(Boolean);
      acc = "";
      parts.forEach((p, i) => {
        acc = i === 0 ? p + "\\" : (acc.endsWith("\\") ? acc : acc + "\\") + p;
        const target = acc;
        if (i) c.append(el("span", { class: "sep" }, "›"));
        c.append(el("button", { onclick: () => this.load(target) }, p));
      });
    } else {
      parts = this.path.split("/").filter(Boolean);
      c.append(el("button", { onclick: () => this.load("/") }, "/"));
      acc = "";
      parts.forEach((p) => {
        acc += "/" + p;
        const target = acc;
        c.append(el("span", { class: "sep" }, "›"), el("button", { onclick: () => this.load(target) }, p));
      });
    }
    c.title = "Double-click to type a path";
  }
  editPath() { this.editing = true; this.renderCrumbs(); }

  visible() {
    const f = this.filter;
    let list = this.entries.filter((e) => (app.showHidden || !e.hidden) && (!f || e.name.toLowerCase().includes(f)));
    const { key, dir } = this.sort;
    list.sort((a, b) => {
      if (a.dir !== b.dir) return a.dir ? -1 : 1;
      let r = key === "name" ? a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" })
        : key === "size" ? a.size - b.size : a.mtime - b.mtime;
      return r * dir;
    });
    return list;
  }

  renderList() {
    const L = this.listEl;
    L.innerHTML = "";
    if (!this.isLocal && !app.connected) { L.append(disconnectedCard()); this.renderSummary(); return; }
    if (this.error) {
      L.append(el("div", { class: "empty" }, el("div", { class: "card" }, el("h3", {}, "Can't open this folder"), el("div", {}, this.error),
        el("button", { onclick: () => this.load(this.path) }, "Retry"))));
      this.renderSummary(); return;
    }
    const rows = this.visible();
    this.rows = rows;
    const allSel = rows.length > 0 && rows.every((e) => this.sel.has(e.name));
    const th = (key, label, cls) => el("th", { class: cls + (this.sort.key === key ? " sorted" : ""),
      onclick: () => { this.sort = { key, dir: this.sort.key === key ? -this.sort.dir : 1 }; this.renderList(); } },
      label + (this.sort.key === key ? (this.sort.dir > 0 ? " ↑" : " ↓") : ""));
    const head = el("thead", {}, el("tr", {},
      el("th", { class: "cb" }, el("input", { type: "checkbox", title: "Select all", checked: allSel,
        onchange: (e) => { rows.forEach((r) => e.target.checked ? this.sel.add(r.name) : this.sel.delete(r.name)); this.renderList(); } })),
      th("name", "Name", "name"), th("size", "Size", "size"), th("mtime", "Modified", "date")));
    const body = el("tbody");
    rows.forEach((e, idx) => {
      const full = this.join(e.name);
      const cut = !this.isLocal && app.clip && app.clip.move && app.clip.paths.includes(full);
      const known = this.sizes && this.sizes.get(e.name);
      const tr = el("tr", { class: (e.dir ? "dir " : "") + (this.sel.has(e.name) ? "sel " : "") + (e.hidden ? "hidden-file " : "")
          + (cut ? "cut " : "") + (e.protected ? "locked" : ""),
        draggable: "true", "data-idx": idx },
        el("td", { class: "cb" }, el("input", { type: "checkbox", checked: this.sel.has(e.name),
          onclick: (ev) => { ev.stopPropagation(); this.toggle(e.name, idx, ev, true); } })),
        el("td", { class: "name", title: e.protected ? `${e.name}\nProtected PS5 system folder: it can't be deleted, renamed or moved from here` : e.name,
          html: e.dir ? ICONS.folder : ICONS.file }),
        el("td", { class: "size", title: known ? `${known.files} files, ${known.folders} folders` : "" },
          e.dir ? (known ? human(known.size) : "") : human(e.size)),
        el("td", { class: "date" }, fmtDate(e.mtime)));
      tr.children[1].append(el("span", {}, e.name));
      tr.addEventListener("click", (ev) => this.toggle(e.name, idx, ev, false));
      tr.addEventListener("dblclick", () => { if (e.dir) this.load(this.join(e.name)); });
      tr.addEventListener("contextmenu", (ev) => {
        if (this.isLocal) return;
        ev.preventDefault();
        if (!this.sel.has(e.name)) { this.sel.clear(); this.sel.add(e.name); this.anchor = idx; this.renderList(); }
        this.contextMenu(ev.clientX, ev.clientY, e);
      });
      tr.addEventListener("dragstart", (ev) => {
        // Re-rendering here would detach the dragged row and Chrome would
        // cancel the drag, so update the selection styling in place.
        if (!this.sel.has(e.name)) {
          this.sel.clear(); this.sel.add(e.name); this.anchor = idx;
          for (const row of body.children) {
            const on = row === tr;
            row.classList.toggle("sel", on);
            row.querySelector("input").checked = on;
          }
          this.renderSummary();
        }
        dragSide = this.side; ev.dataTransfer.effectAllowed = "copy"; ev.dataTransfer.setData("text/plain", "ps5cable");
      });
      tr.addEventListener("dragend", () => { dragSide = null; local.root.classList.remove("drop"); remote.root.classList.remove("drop"); });
      body.append(tr);
    });
    L.append(el("table", {}, head, body));
    if (!rows.length) L.append(el("div", { class: "empty" }, el("div", {}, this.filter ? "No matches" : "This folder is empty")));
    if (this.loading) L.append(el("div", { class: "loading" }, el("div", { class: "spin" })));
    this.renderSummary();
  }

  toggle(name, idx, ev, fromCheckbox) {
    if (ev.shiftKey && this.anchor != null && this.rows) {
      const [a, b] = [Math.min(this.anchor, idx), Math.max(this.anchor, idx)];
      for (let i = a; i <= b; i++) this.sel.add(this.rows[i].name);
    } else if (fromCheckbox || ev.ctrlKey || ev.metaKey) {
      this.sel.has(name) ? this.sel.delete(name) : this.sel.add(name);
      this.anchor = idx;
    } else {
      const only = this.sel.size === 1 && this.sel.has(name);
      this.sel.clear();
      if (!only) this.sel.add(name);
      this.anchor = idx;
    }
    this.renderList();
  }

  renderSummary() {
    const picked = this.entries.filter((e) => this.sel.has(e.name));
    const files = picked.filter((e) => !e.dir), dirs = picked.length - files.length;
    const bytes = files.reduce((s, e) => s + e.size, 0);
    const parts = [];
    if (files.length) parts.push(`${files.length} file${files.length > 1 ? "s" : ""} · ${human(bytes)}`);
    if (dirs) parts.push(`${dirs} folder${dirs > 1 ? "s" : ""}`);
    this.sumEl.textContent = parts.length ? parts.join(" + ") + " selected" : `${this.entries.length} items`;
    this.summaryText = parts.join(" + ");
    this.renderActions();
    updateRail();
  }

  async load(path) {
    if (!this.isLocal && !app.connected) { this.renderList(); return; }
    this.loading = true; this.renderList();
    try {
      const d = await api("GET", `/api/${this.side}/list` + qs(path ? { path } : {}));
      const changed = d.path !== this.path;
      this.path = d.path; this.parent = d.parent; this.sep = d.sep; this.entries = d.entries; this.error = null;
      if (changed) { this.sel.clear(); this.anchor = null; this.filter = ""; this.filterEl.value = ""; this.sizes = new Map(); }
      else { const names = new Set(d.entries.map((e) => e.name)); for (const n of [...this.sel]) if (!names.has(n)) this.sel.delete(n); }
      this.freeEl.textContent = d.total ? `${human(d.free)} free of ${human(d.total)}` : "";
    } catch (e) {
      this.error = e.message;
      if (path !== this.path) toast(e.message, "err");
    } finally {
      this.loading = false;
      this.renderPlaces(); this.renderCrumbs(); this.renderList();
    }
  }

  selectedPaths() { return [...this.sel].map((n) => this.join(n)); }

  async newFolder() {
    const name = await modal({ title: "New folder", text: `In ${this.path}`, input: "New folder", okText: "Create" });
    if (!name) return;
    try { await api("POST", `/api/${this.side}/mkdir`, { path: this.join(name) }); await this.load(this.path); }
    catch (e) { toast(e.message, "err"); }
  }
  async rename() {
    const [old] = [...this.sel];
    const name = await modal({ title: "Rename", input: old, okText: "Rename" });
    if (!name || name === old) return;
    try { await api("POST", "/api/remote/rename", { src: this.join(old), dst: this.join(name) }); this.sel.clear(); this.sel.add(name); await this.load(this.path); }
    catch (e) { toast(e.message, "err"); }
  }
  async remove() {
    const paths = this.selectedPaths();
    const ok = await modal({ title: `Delete ${paths.length} item${paths.length > 1 ? "s" : ""} from the PS5?`,
      text: paths.slice(0, 6).join("\n") + (paths.length > 6 ? `\n…and ${paths.length - 6} more` : "") + "\n\nFolders are deleted with everything inside. This cannot be undone.",
      okText: "Delete", danger: true });
    if (!ok) return;
    try { await api("POST", "/api/remote/delete", { paths }); this.sel.clear(); toast("Deleted", "ok"); await this.load(this.path); }
    catch (e) { toast(e.message, "err"); await this.load(this.path); }
  }

  lockedSelection() {
    const e = this.entries.find((x) => x.protected && this.sel.has(x.name));
    return e ? e.name : null;
  }
  setClip(move) {
    if (!this.sel.size) return;
    app.clip = { move, paths: this.selectedPaths() };
    toast(`${move ? "Cut" : "Copied"} ${app.clip.paths.length} item(s). Open a folder and paste (Ctrl+V).`);
    this.renderList();
  }
  async paste() {
    if (!app.clip || !this.path) return;
    const { move, paths } = app.clip;
    if (await remoteCopy(paths, this.path, move) && move) { app.clip = null; this.renderList(); }
  }
  async copyTo(anchor, move) {
    const paths = this.selectedPaths();
    if (!paths.length) return;
    const dest = await pickRemoteFolder(anchor, move, this.path);
    if (dest) await remoteCopy(paths, dest, move);
  }
  async showSize() {
    const paths = this.sel.size ? this.selectedPaths() : [this.path];
    toast("Counting on the PS5…");
    try {
      const d = await api("POST", "/api/remote/size", { paths });
      for (const it of d.items) {
        const name = it.path.split("/").pop();
        if (this.sel.size) this.sizes.set(name, it);
      }
      this.renderList();
      const list = d.items.length > 1 ? el("ul", {}, d.items.map((it) =>
        el("li", {}, el("span", {}, it.path), el("span", {}, human(it.size))))) : null;
      await modal({ title: d.items.length > 1 ? `${d.items.length} items` : d.items[0].path,
        extra: el("div", { class: "size-sum" }, el("b", {}, human(d.size)),
          el("span", {}, `${d.files.toLocaleString()} files, ${d.folders.toLocaleString()} folders`), list),
        okText: "Close" });
    } catch (e) { toast(e.message, "err"); }
  }
  contextMenu(x, y, entry) {
    closeMenus();
    const n = this.sel.size, locked = this.lockedSelection(), off = !app.connected;
    const item = (icon, label, key, fn, opts = {}) => el("button", { class: opts.danger ? "danger" : "", disabled: !!opts.disabled,
      title: opts.title || "", onclick: (e) => { menu.remove(); fn(e); } },
      el("span", { html: icon }), el("span", {}, label), el("kbd", {}, key || ""));
    const lockTip = locked ? `${locked} is a protected system folder` : "";
    const menu = el("div", { class: "menu ctx" },
      n === 1 && entry.dir ? item(ICONS.folder, "Open", "Enter", () => this.load(this.join(entry.name))) : null,
      item(ICONS.down, "Download to PC", "", () => startTransfer("download"), { disabled: off || !local.path }),
      el("hr"),
      item(ICONS.copy, "Copy", "Ctrl+C", () => this.setClip(false)),
      item(ICONS.cut, "Cut", "Ctrl+X", () => this.setClip(true), { disabled: !!locked, title: lockTip }),
      item(ICONS.paste, app.clip ? `Paste ${app.clip.paths.length} here` : "Paste", "Ctrl+V", () => this.paste(), { disabled: !app.clip }),
      item(ICONS.copy, "Copy to…", "", () => this.copyTo(this.actions, false)),
      item(ICONS.move, "Move to…", "", () => this.copyTo(this.actions, true), { disabled: !!locked, title: lockTip }),
      el("hr"),
      item(ICONS.rename, "Rename", "F2", () => this.rename(), { disabled: n !== 1 || !!locked, title: lockTip }),
      item(ICONS.size, "Size", "", () => this.showSize()),
      item(ICONS.link, n > 1 ? "Copy paths" : "Copy path", "", () => copyText(this.selectedPaths().join("\n"))),
      el("hr"),
      item(ICONS.trash, `Delete${n > 1 ? ` ${n} items` : ""}`, "Del", () => this.remove(), { danger: true, disabled: !!locked, title: lockTip }));
    document.body.append(menu);
    const r = menu.getBoundingClientRect();
    menu.style.left = `${Math.min(x, window.innerWidth - r.width - 8)}px`;
    menu.style.top = `${Math.min(y, window.innerHeight - r.height - 8)}px`;
    dismissOnOutsideClick(menu);
  }
}

function closeMenus() { document.querySelectorAll(".menu").forEach((m) => m.remove()); }

function dismissOnOutsideClick(menu) {
  setTimeout(() => {
    const off = (e) => {
      if (e.type === "keydown" && e.key !== "Escape") return;
      if (e.type !== "keydown" && menu.contains(e.target)) return;
      menu.remove();
      document.removeEventListener("mousedown", off); document.removeEventListener("keydown", off);
    };
    document.addEventListener("mousedown", off); document.addEventListener("keydown", off);
  }, 0);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied to the clipboard", "ok"); }
  catch (e) { toast(text); }
}

// Destinations offered by "Copy to…" / "Move to…": the PS5's drives, the game
// folders scene tools scan, or any typed path.
function pickRemoteFolder(anchor, move, current) {
  closeMenus();
  return new Promise((resolve) => {
    const menu = el("div", { class: "menu" });
    const done = (v) => { menu.remove(); resolve(v); };
    const opt = (path, hint, tag) => el("button", { title: hint || path, onclick: async () => {
      try {
        if (tag === "Will be created") { await api("POST", "/api/remote/mkdir", { path }); loadRemotePlaces(true); }
        done(path);
      } catch (e) { toast(e.message, "err"); done(null); }
    } }, el("code", {}, path), tag ? el("span", { class: "tag" + (tag === "Will be created" ? " new" : "") }, tag) : el("span"),
      hint ? el("small", {}, hint) : null);
    menu.append(el("h4", {}, `${move ? "Move" : "Copy"} to`));
    const drives = (remote.places || []).filter((p) => p.drive);
    if (drives.length) {
      menu.append(el("h4", {}, "Drives"));
      for (const d of drives) menu.append(opt(d.path, d.name, d.path === current ? "This folder" : ""));
    }
    let group = null;
    for (const f of app.gameFolders || []) {
      if (f.drive !== group) { group = f.drive; menu.append(el("h4", {}, `Game folders · ${group}`)); }
      menu.append(opt(f.path, f.hint, f.path === current ? "This folder" : f.exists ? (f.recommended ? "Recommended" : "") : "Will be created"));
    }
    menu.append(el("h4", {}, "Other"));
    menu.append(el("button", { onclick: async () => {
      menu.remove();
      const p = await modal({ title: `${move ? "Move" : "Copy"} to which PS5 folder?`, text: "Type an absolute path, e.g. /mnt/usb0/homebrew. Missing folders are created.",
        input: current || "/data", okText: move ? "Move here" : "Copy here" });
      if (!p) return resolve(null);
      try { await api("POST", "/api/remote/mkdir", { path: p.trim() }); resolve(p.trim()); }
      catch (e) { toast(e.message, "err"); resolve(null); }
    } }, el("span", {}, "Type a folder path…"), el("span")));
    const r = anchor.getBoundingClientRect();
    document.body.append(menu);
    const h = menu.getBoundingClientRect().height;
    menu.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - 440))}px`;
    menu.style.top = `${r.top - h - 6 > 8 ? r.top - h - 6 : Math.min(r.bottom + 6, window.innerHeight - h - 8)}px`;
    setTimeout(() => {
      const off = (e) => {
        if (e.type === "keydown" && e.key !== "Escape") return;
        if (e.type !== "keydown" && menu.contains(e.target)) return;
        document.removeEventListener("mousedown", off); document.removeEventListener("keydown", off);
        if (document.body.contains(menu)) done(null);
      };
      document.addEventListener("mousedown", off); document.addEventListener("keydown", off);
    }, 0);
  });
}

async function remoteCopy(sources, dest, move) {
  try {
    await api("POST", "/api/remote/copy", { sources, dest, move });
    $("transfers").classList.remove("collapsed");
    pollJobs();
    return true;
  } catch (e) { toast(e.message, "err"); return false; }
}

let dragSide = null;

function disconnectedCard() {
  const st = app.status || { state: "starting" };

  const opened = ["waiting", "connected"].includes(st.state);
  const step = (done, active, ...text) => el("li", { class: done ? "done" : active ? "active" : "" },
    el("span", { class: "tick" }, done ? "✓" : ""), el("span", {}, ...text));
  const elf = app.payloadPath ? el("code", {}, app.payloadPath) : "ps5cable.elf";
  return el("div", { class: "empty" }, el("div", { class: "card" },
    el("div", { html: ICONS.plug.replace("<svg", '<svg class="big"') }),
    el("h3", {}, opened ? "USB cable found" : "PS5 not connected"),
    el("ol", { class: "steps" },
      step(plugged, !plugged, "USB bridge (data link) cable plugged into this PC, with a USB-C or USB-A end"),
      step(opened, ["no_access", "no_driver"].includes(st.state),
        app.os === "nt" ? "USB driver installed on the cable (once)" : "Cable can be opened by this app"),
      step(false, opened, "Other end in a PS5 USB port, with the PS5 Cable payload running (load ",
        elf, " with your jailbreak)")),
    el("div", { style: "display:flex; gap:8px" },
      el("button", { class: st.state === "no_driver" ? "" : "primary", title: "Look for the cable again and list every USB device on this PC",
                     onclick: (e) => rescanUsb(e.currentTarget) },
        el("span", { html: ICONS.refresh, style: "display:contents" }), "Rescan USB"),
      app.canInstallDriver ? el("button", {
        class: st.state === "no_driver" ? "primary" : "",
        title: "Puts Windows' WinUSB driver on the bridge cable so this app can use it. Windows asks for your OK once.",
        onclick: (e) => installDriver(e.currentTarget) }, "Install driver") : null),
    el("small", { style: "color:#6b7689; max-width: 420px" }, st.detail || linkSubtitle(st)),
    usbDeviceList(),
    el("details", {}, el("summary", {}, "USB-C ⇄ USB-C, USB-A ⇄ USB-C or USB-A ⇄ USB-A: which ports?"),
      cableGuide())));
}

function usbDeviceList() {
  const s = app.usbScan;
  if (!s) return null;
  if (s.error) return el("div", { class: "usblist err-text" }, s.error);
  const n = s.devices.length;
  return el("div", { class: "usblist" },
    el("div", { class: "head" }, el("b", {}, `${n} USB device${n === 1 ? "" : "s"} on this PC`),
      el("small", {}, "scanned " + new Date(s.at).toLocaleTimeString())),
    n ? el("ul", {}, s.devices.map((d) => el("li", { class: d.bridge ? "bridge" : "" },
      el("b", {}, d.name), el("small", {}, [d.kind, d.speed, d.id].filter(Boolean).join(" · ")))))
      : el("p", {}, "No USB devices found."),
    !s.devices.some((d) => d.bridge)
      ? el("p", { class: "warn-text" }, "No USB bridge cable among them. A plain USB cable never shows up here: " +
          "it needs a bridge chip such as the Prolific PL27A1. Check that the cable is pushed fully into this PC.")
      : null);
}

async function installDriver(btn) {
  btn.disabled = true;
  btn.textContent = "Installing… choose Yes, then wait";
  try {
    const r = await api("POST", "/api/usb/install-driver", {});
    app.usbScan = { ...r.usb, at: Date.now() };
    toast(r.result.message, "ok");
    applyStatus(r.status);
    if (!app.connected) remote.renderList();
  } catch (e) {
    toast(e.message, "err");
    if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = "Install driver"; }
  }
}

async function rescanUsb(btn) {
  if (btn) { btn.disabled = true; btn.lastChild.textContent = "Scanning…"; }
  try {
    const r = await api("POST", "/api/usb/rescan", {});
    app.usbScan = { ...r.usb, at: Date.now() };
    applyStatus(r.status);
    if (!app.connected) remote.renderList();
    const bridge = r.usb.devices.some((d) => d.bridge);
    toast(r.status.connected ? "PS5 connected over USB" : bridge ? "Found the USB bridge cable" : "No USB bridge cable found",
          r.status.connected || bridge ? "ok" : "err");
  } catch (e) {
    toast(e.message, "err");
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.lastChild.textContent = "Rescan USB"; }
  }
}

function cableGuide() {
  const g = app.usbGuide;

  return el("div", { class: "guide" },

      g.pc_port_tip + " " + g.ps5_port_tip));

const local = new Pane("local");
const remote = new Pane("remote");

function updateRail() {
  const up = $("btn-upload"), down = $("btn-download");
  up.disabled = !app.connected || local.sel.size === 0 || !remote.path;
  down.disabled = !app.connected || remote.sel.size === 0 || !local.path;
  $("up-sum").textContent = local.sel.size ? local.summaryText : "select files on the PC";
  $("down-sum").textContent = remote.sel.size ? remote.summaryText : "select files on the PS5";
  const names = [...local.sel].map((n) => n.toLowerCase());
  const tips = [];
  if (names.some((n) => n.endsWith(".pkg") || n.endsWith(".fpkg")))
    tips.push(".pkg files are copied, not installed. Install them afterwards with etaHEN or ps5upload's Install Package.");
  if (names.some((n) => /\.(exfat|ffpkg|ffpfs|ffpfsc)$/.test(n)))
    tips.push("Game images mount through ShadowMount+: send them to a homebrew folder (see Game folders).");
  $("pkg-tip").hidden = !tips.length;
  $("pkg-tip").textContent = tips.join(" ");
}

// ---------------------------------------------------------------- connection

const LINK_TEXT = {
  connected: ["PS5 Connected", "ok"],
  waiting: ["USB cable found", "warn"],
  no_access: ["Cable can't be opened", "warn"],
  no_driver: ["Cable needs a driver", "warn"],
  no_backend: ["USB support missing", "warn"],
  no_cable: ["PS5 not connected", ""],
  starting: ["PS5 not connected", ""],
};

function linkSubtitle(st) {
  switch (st.state) {
    case "connected": {
      const usb = st.link && st.link.usb_label ? " · " + st.link.usb_label.replace(/ \(.*/, "") : "";
      return "Connected over USB" + usb;
    }
    case "waiting": return "Waiting for the PS5 Cable payload on the PS5";
    case "no_driver": return "Click Install driver (once)";
    case "no_access": return app.os === "nt" ? "Another program may be using the cable" : "No permission to open the cable";
    case "no_backend": return "Install pyusb and libusb";
    case "starting": return "Looking for the USB cable…";
    case "no_cable": return "A normal USB-C cable will not show up";
    default: return "Plug in a USB bridge cable (USB-C or USB-A ends)";
  }
}

function applyStatus(st) {
  const was = app.connected;
  app.status = st;
  app.connected = !!st.connected;
  const [title, cls] = LINK_TEXT[st.state] || LINK_TEXT.offline;
  const link = $("link");
  link.className = "link" + (cls ? " " + cls : "");
  $("link-title").textContent = title;
  $("link-sub").textContent = linkSubtitle(st);
  link.title = st.detail || st.error || linkSubtitle(st);
  document.title = (app.connected ? "PS5 Connected" : title) + " · PS5 Cable";
  remote.linkEl.textContent = app.connected ? "Connected" : (st.state === "waiting" ? "Cable found" : "Offline");
  remote.linkEl.className = "linkchip" + (app.connected ? " ok" : "");
  const m = $("ps5-meter");
  m.hidden = !app.connected;
  if (app.connected) {
    $("ps5-banner").textContent = st.banner;
    if (st.total) {
      $("ps5-used").style.width = `${(100 * (st.total - st.free) / st.total).toFixed(1)}%`;
      $("ps5-free").textContent = `${human(st.free)} free of ${human(st.total)} on /data`;
      remote.freeEl.textContent = `${human(st.free)} free`;
    }
  } else remote.freeEl.textContent = "";
  if (app.connected && !was) {
    toast("PS5 connected over USB", "ok");
    loadRemotePlaces();
    remote.load(remote.path || app.settings.remote_dir);
  }
  if (!app.connected && was) { remote.renderList(); toast("Lost connection to the PS5", "err"); }
  if (!app.connected && (!was || app.lastState !== st.state)) remote.renderList();
  app.lastState = st.state;
  renderCable(st.link);
  remote.renderActions(); updateRail();
  clearTimeout(app.statusTimer);
  app.statusTimer = setTimeout(pollStatus, app.connected ? 5000 : 2000);
}

// ---------------------------------------------------------------- USB cable

const fmtRate = (v) => v == null ? "—" : `${v >= 10 ? Math.round(v) : v.toFixed(1)} MB/s`;

function renderCable(link) {
  const b = $("cable");
  if (!link) { b.hidden = true; return; }
  b.hidden = false;
  b.className = "cable" + (["ok", "warn", "bad"].includes(link.level) ? " " + link.level : "");
  $("cable-title").textContent = link.summary || "USB bridge cable";
  const st = app.status && app.status.speedtest;
  let sub;
  if (st) sub = `Measured ${fmtRate(Math.min(st.up_mbs, st.down_mbs))}` + (link.expected_mbs ? ` · max ~${fmtRate(link.expected_mbs)}` : "");
  else if (link.expected_mbs) sub = `Max ~${fmtRate(link.expected_mbs)} · limited by ${link.bottleneck.replace(/ \(.*/, "")}`;
  else sub = "Click for a speed test";
  $("cable-sub").textContent = sub;
  b.title = (link.notes || []).join("\n") || "USB cable details and speed test";
  if (app.cablePanel) app.cablePanel.render();

function openCablePanel() {
  if (app.cablePanel) return;
  const body = el("div", { style: "display:grid; gap:14px" });
  const runBtn = el("button", { class: "primary" }, "Run speed test");
  const close = () => { bg.remove(); app.cablePanel = null; };
  const bg = el("div", { class: "modal-bg", onclick: (e) => { if (e.target === bg) close(); } },
    el("div", { class: "modal wide" },
      el("h3", {}, "USB cable"), body,
      el("div", { class: "row" }, el("button", { onclick: close }, "Close"), runBtn)));
  let running = false;

  const render = () => {
    const link = (app.status && app.status.link) || {};
    const st = app.status && app.status.speedtest;
    const ids = link.vendor_id && link.product_id ? ` (${link.vendor_id}:${link.product_id})` : "";
    const facts = [
      ["Bridge chip", (link.chip || "Unknown") + ids],
      ["Connection", link.connection],
      ["Bridge rated", link.chip_mbps ? (link.chip_mbps > 480 ? "USB 3 (5 Gbps)" : "USB 2.0 (480 Mbps)") : null],
      ["This PC's port", link.usb_label || "Not reported (run a speed test)"],
      ["Cable ends", "USB-C or USB-A, any combination (not detectable, and it doesn't change the speed)"],
      ["PS5 port", "Rear USB-A (USB-A end) or SuperSpeed front USB-C (USB-C end)"],
      ["Best case", link.expected_mbs ? `${fmtRate(link.expected_mbs)}  ·  ~${(link.expected_mbs * 60 / 1024).toFixed(1)} GB per minute` : null],
    ].filter(([, v]) => v);
    const dl = el("dl", { class: "facts" }, facts.flatMap(([k, v]) =>
      [el("dt", {}, k), el("dd", { class: k === "Best case" ? "hl" : null }, v)]));

    const rows = (link.limits || []).map((l) => ({ name: l.name, mbs: l.mbs, limit: l.name === link.bottleneck }));
    if (st) rows.push({ name: "Measured (upload)", mbs: st.up_mbs }, { name: "Measured (download)", mbs: st.down_mbs });
    const scale = Math.max(...rows.map((r) => r.mbs), 1);
    const bars = el("div", { class: "bars" }, rows.map((r) => el("div", { class: "b" + (r.limit ? " limit" : "") },
      el("span", { title: r.limit ? "Slowest part of the chain" : "" }, r.name + (r.limit ? " ◂ limit" : "")),
      el("div", { class: "track" }, el("i", { style: `width:${Math.max(2, 100 * r.mbs / scale).toFixed(1)}%` })),
      el("span", {}, fmtRate(r.mbs)))));

    const notes = (link.notes || []).length
      ? el("ul", { class: "notes " + (link.level || "") }, link.notes.map((n) => el("li", {}, n))) : null;
    const result = st ? el("div", { class: "st-result" },
      el("div", { class: "nums" },
        el("span", {}, "Upload ", el("b", {}, fmtRate(st.up_mbs))),
        el("span", {}, "Download ", el("b", {}, fmtRate(st.down_mbs))),
        el("span", { style: "color:#8b95a7; align-self:end" }, `at ${new Date(st.at * 1000).toLocaleTimeString()}`)),
      el("ul", { class: "notes " + st.verdict }, st.notes.map((n) => el("li", {}, n)))) : null;
    const guide = el("details", {}, el("summary", {}, "Which ports for USB-C ⇄ USB-C, USB-A ⇄ USB-C and USB-A ⇄ USB-A cables"),
      cableGuide());
    body.replaceChildren(dl, bars, notes || "", result || "", guide);
    runBtn.disabled = running || !app.connected;
    runBtn.textContent = running ? "Testing… (about 6 s)" : st ? "Run again" : "Run speed test";
    runBtn.title = app.connected ? "Sends and receives test data in memory; nothing is written to the PS5"
                                 : "The PS5 is not connected";
  };

  runBtn.addEventListener("click", async () => {
    running = true; render();
    try {
      const r = await api("POST", "/api/speedtest", {});
      app.status.speedtest = r;
      toast(`Speed test: ${fmtRate(r.up_mbs)} up, ${fmtRate(r.down_mbs)} down`, r.verdict === "ok" ? "ok" : "err");
    } catch (e) { toast(e.message, "err"); }
    running = false;
    renderCable(app.status.link);
    render();
  });
  app.cablePanel = { render };
  render();
  document.body.append(bg);
}

async function pollStatus() {
  try { applyStatus((await api("GET", "/api/state")).status); }
  catch (e) { app.statusTimer = setTimeout(pollStatus, 3000); }
}

async function loadRemotePlaces(refresh) {
  try {
    const d = await api("GET", "/api/remote/places" + (refresh ? "?refresh=1" : ""));
    remote.places = d.places; app.gameFolders = d.game_folders;
    remote.renderPlaces();
  } catch (e) { /* not connected yet */ }

function openGameFolders(anchor) {
  document.querySelectorAll(".menu").forEach((m) => m.remove());
  const folders = app.gameFolders || [];
  const menu = el("div", { class: "menu" });
  let group = null;
  for (const f of folders) {
    if (f.drive !== group) { group = f.drive; menu.append(el("h4", {}, group)); }
    menu.append(el("button", { title: f.hint, onclick: async () => {
      menu.remove();
      try {
        if (!f.exists) { await api("POST", "/api/remote/mkdir", { path: f.path }); toast(`Created ${f.path}`, "ok"); loadRemotePlaces(true); }
        remote.load(f.path);
      } catch (e) { toast(e.message, "err"); }
    } },
      el("code", {}, f.path),
      f.recommended ? el("span", { class: "tag" }, "Recommended") : (!f.exists ? el("span", { class: "tag new" }, "Will be created") : el("span")),
      el("small", {}, f.hint + (f.recommended && !f.exists ? " (will be created)" : ""))));
  }
  if (!folders.length) menu.append(el("div", { style: "padding:10px; color:#8b95a7" }, "Connect to the PS5 to see its drives."));
  const r = anchor.getBoundingClientRect();
  menu.style.top = `${r.bottom + 6}px`;
  menu.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - 440))}px`;
  document.body.append(menu);
  setTimeout(() => document.addEventListener("click", function off(e) {
    if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener("click", off); }

async function cvCheck() {
  const cv = app.cv;
  if (!cv.source.trim()) { toast("Type or pick a game folder or image first", "err"); return; }
  Object.assign(cv, { checking: true, info: null, estimates: null, error: null });
  cvRender();
  try {
    cv.info = await api("POST", "/api/convert/inspect", { source: cv.source, output_dir: cv.output_dir });
    if (!cv.output_dir) cv.output_dir = cv.info.output_dir;
    if (!cv.info.is_image && cv.make === "folder") cv.make = cv.info.ps5_title ? "image" : "pkg";
    if (cv.info.is_image && /\.(pkg|fpkg)$/i.test(cv.source) && cv.make !== "folder") cv.make = "folder";
    cv.firmware = cv.info.min_firmware || "";
    cv.estimates = "pending";
    api("POST", "/api/convert/estimate", { source: cv.source, output_dir: cv.output_dir })
      .then((e) => { if (app.cv === cv) { cv.estimates = e; cvRender(); } })
      .catch(() => { if (app.cv === cv) { cv.estimates = null; cvRender(); } });
  } catch (e) { cv.error = e.message; }

  cvRender();
